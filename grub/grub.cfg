# Bengal Tiger OS v1.0.0 - GRUB Bootloader Configuration
#
# Loaded from /boot/grub/grub.cfg

set timeout=3
set default=0

set menu_color_normal=white/black
set menu_color_highlight=yellow/black

insmod all_video

# ==================================================
# Default Boot Entry - VBE High-Resolution Console
# ==================================================

menuentry "Bengal Tiger OS v1.0.0 (Graphics 1024x768x32)" {
    set gfxpayload=1024x768x32
    multiboot /boot/kernel.bin
    boot
}

# ==================================================
# Classic VGA Text Mode (80x25)
# ==================================================

menuentry "Bengal Tiger OS v1.0.0 (VGA Text 80x25)" {
    set gfxpayload=text
    multiboot /boot/kernel.bin text
    boot
}

# ==================================================
# Additional Graphics Resolutions
# ==================================================

menuentry "Bengal Tiger OS v1.0.0 (Graphics 1280x1024x32)" {
    set gfxpayload=1280x1024x32
    multiboot /boot/kernel.bin
    boot
}

menuentry "Bengal Tiger OS v1.0.0 (Graphics 800x600x32)" {
    set gfxpayload=800x600x32
    multiboot /boot/kernel.bin
    boot
}

# ==================================================
# Headless / Serial Console Mode (COM1 115200 8N1)
# ==================================================

menuentry "Bengal Tiger OS v1.0.0 (Headless / Serial Debug)" {
    set gfxpayload=text
    multiboot /boot/kernel.bin headless
    boot
}

# ==================================================
# Power Control
# ==================================================

menuentry "Reboot System" {
    reboot
}

menuentry "Halt System" {
    halt
}
