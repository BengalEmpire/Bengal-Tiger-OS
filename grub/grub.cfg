# Bengal Tiger OS - GRUB Configuration
#
# This file configures the GRUB bootloader for Bengal Tiger OS.
# GRUB loads this from /boot/grub/grub.cfg

# Timeout before auto-selecting default entry
set timeout=5

# Default menu entry (0 = first entry)
set default=0

# Boot menu background color (if supported)
set menu_color_normal=white/black
set menu_color_highlight=yellow/black

# Load video modules for graphics mode support
insmod all_video

# ==================================================
# Main Boot Entry - VGA Text Mode
# ==================================================

menuentry "Bengal Tiger OS (VGA Text 80x25)" {
    # Default text mode
    set gfxpayload=text
    multiboot /boot/kernel.bin
    boot
}

# ==================================================
# Graphics Mode Boot Entries
# ==================================================

menuentry "Bengal Tiger OS (1024x768x32)" {
    set gfxpayload=1024x768x32
    multiboot /boot/kernel.bin
    boot
}

menuentry "Bengal Tiger OS (800x600x32)" {
    set gfxpayload=800x600x32
    multiboot /boot/kernel.bin
    boot
}

menuentry "Bengal Tiger OS (1280x1024x32)" {
    set gfxpayload=1280x1024x32
    multiboot /boot/kernel.bin
    boot
}

# ==================================================
# Recovery / Debug Entry
# ==================================================

menuentry "Bengal Tiger OS (Debug - VGA Text)" {
    set gfxpayload=text
    multiboot /boot/kernel.bin debug
    boot
}

# ==================================================
# Halt System
# ==================================================

menuentry "Halt System" {
    halt
}